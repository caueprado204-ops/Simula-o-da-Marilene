<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulação Marilene</title>
<meta name="author" content="Cauê Prado">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B1E3F'/%3E%3Cpath d='M26 12h12v14h14v12H38v14H26V38H12V26h14z' fill='%23E5303B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1E3F; --navy-2:#132C57; --blue:#2B6CFF; --blue-2:#1B4FD1;
  --sky:#38BDF8; --ice:#F3F8FF; --ice-2:#E2EDFF; --line:#C9DBFF;
  --red:#E5303B; --red-2:#B81E28; --muted:#4A6491;
  --r:clamp(18px,2vw,28px);
  --gap:clamp(10px,1.4vh,18px);
  --cond:'Barlow Condensed',Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  color:var(--navy);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;
  background:
    radial-gradient(120% 80% at 10% 0%,rgba(43,108,255,.35),transparent 60%),
    radial-gradient(90% 70% at 100% 100%,rgba(56,189,248,.18),transparent 60%),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,
    var(--navy);
}
button{font:inherit;color:inherit;cursor:pointer}
.app{
  height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:var(--gap);
  padding:clamp(10px,1.6vh,22px) clamp(12px,1.6vw,28px) clamp(24px,3vh,32px);
}

/* ---------- NAV ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ice);border-radius:999px;padding:6px 8px;box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .avatar{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;background:linear-gradient(160deg,var(--sky),var(--blue));display:grid;place-items:end center;box-shadow:0 0 0 2.5px var(--ice),0 0 0 4.5px var(--red)}
.brand .avatar img{width:88%;display:block}
.wordmark{line-height:.92}
.wordmark small{display:block;margin-bottom:3px;font-weight:800;font-size:9px;letter-spacing:.28em;color:var(--red)}
.wordmark b{font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.02em;white-space:nowrap;text-transform:uppercase}
.tag{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%;background:#4ADE80;animation:blink 1.4s infinite}

/* ---------- MAIN ---------- */
.main{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:var(--gap);min-height:0}
.hero{
  position:relative;overflow:hidden;border-radius:var(--r);color:#fff;
  padding:clamp(16px,2.6vh,32px) clamp(18px,2vw,34px);
  background:linear-gradient(165deg,var(--blue) 0%,var(--blue-2) 55%,var(--navy-2) 100%);
  box-shadow:0 14px 34px -20px rgba(0,0,0,.7);min-height:0;
}
.hero::before{
  content:"";position:absolute;right:-18%;top:6%;width:85%;aspect-ratio:1;opacity:.1;background:#fff;
  clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);
}
.hero-txt{position:relative;z-index:2}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.16em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 10px}
.pill i{width:7px;height:7px;border-radius:50%;background:#4ADE80;animation:blink 1.4s infinite}
.hero h1{margin:clamp(8px,1.4vh,16px) 0 0;font-family:var(--cond);font-weight:800;font-size:clamp(26px,3vw,56px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.hero h1 span{color:var(--sky);display:block}
.hero p{margin:clamp(8px,1.2vh,14px) 0 0;font-size:clamp(12px,1vw,16px);opacity:.85;max-width:20ch}
/* cena: porta do hospital + ambulância + maca */
.scene-wrap{position:absolute;left:0;bottom:0;width:62%;z-index:1;pointer-events:none}
.scene{width:100%;display:block;overflow:hidden}
.scene-cap{position:absolute;left:6%;top:-6%;font-size:clamp(11px,.9vw,14px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--red);padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px -6px rgba(0,0,0,.4);opacity:0;transform:translateY(6px)}
.scene .amb{opacity:0}
.scene .stretcher{opacity:0}
.scene .inlight{opacity:0}
.scene .wheel{transform-box:fill-box;transform-origin:center}
.scene-wrap.arrive .amb{animation:ambIn 4.8s forwards}
.scene-wrap.arrive .amb .wheel{animation:wheelSpin 4.8s forwards}
.scene-wrap.arrive .door-l{animation:doorL 4.8s forwards}
.scene-wrap.arrive .door-r{animation:doorR 4.8s forwards}
.scene-wrap.arrive .inlight{animation:inLight 4.8s forwards}
.scene-wrap.arrive .stretcher{animation:stretch 4.8s forwards}
.scene-wrap.arrive .stretcher .sw{animation:wheelSpin2 4.8s forwards}
.scene-wrap.arrive .lb-r{animation:flashA .4s steps(1) infinite}
.scene-wrap.arrive .lb-b{animation:flashB .4s steps(1) infinite}
.scene-wrap.arrive .scene-cap{animation:capShow 4.8s forwards}
@keyframes ambIn{0%{transform:translateX(-220px);opacity:1;animation-timing-function:cubic-bezier(.15,.8,.3,1)}30%{transform:translateX(0);opacity:1}86%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
@keyframes wheelSpin{0%{transform:rotate(0);animation-timing-function:cubic-bezier(.15,.8,.3,1)}30%,100%{transform:rotate(900deg)}}
@keyframes wheelSpin2{0%,40%{transform:rotate(0)}72%,100%{transform:rotate(720deg)}}
@keyframes doorL{0%,32%{transform:translateX(0)}42%,76%{transform:translateX(-33px)}86%,100%{transform:translateX(0)}}
@keyframes doorR{0%,32%{transform:translateX(0)}42%,76%{transform:translateX(33px)}86%,100%{transform:translateX(0)}}
@keyframes inLight{0%,32%{opacity:0}42%,76%{opacity:.95}86%,100%{opacity:0}}
@keyframes stretch{0%,34%{opacity:0;transform:translateX(0)}40%{opacity:1;transform:translateX(0);animation-timing-function:ease-in-out}72%{opacity:1;transform:translateX(171px)}78%,100%{opacity:0;transform:translateX(186px)}}
@keyframes capShow{0%,24%{opacity:0;transform:translateY(6px)}30%,80%{opacity:1;transform:translateY(0)}90%,100%{opacity:0;transform:translateY(-4px)}}
.fig{position:absolute;right:4%;bottom:-2%;height:64%;z-index:1;filter:drop-shadow(0 14px 20px rgba(0,0,0,.35));animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
body.playing .fig{animation:bounce .45s ease-in-out infinite}
.fig img{height:100%;display:block}

.pads{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto;gap:var(--gap);min-height:0}
/* outros sons (botões pequenos) */
.others{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);border-radius:var(--r);padding:clamp(8px,1.1vh,12px) clamp(12px,1.2vw,18px)}
.others .lbl{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#C9DBFF;margin-right:4px}
.mini{
  position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;
  background:#FDE2EC;color:var(--navy);border-radius:999px;padding:9px 12px 9px 14px;
  font-size:clamp(13px,1vw,15px);font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .15s
}
.mini .emo{font-size:1.25em;line-height:1}
.mini .k{font-size:10px;font-weight:800;border:1.5px solid currentColor;border-radius:6px;width:20px;height:20px;display:grid;place-items:center;opacity:.6}
.mini.active{transform:translateY(2px);box-shadow:0 0 0 3px #fff,0 0 26px 4px #F9A8D4}
.mini.active .emo{animation:wiggle .3s ease-in-out infinite}
.mini.active .k{opacity:0}
.mini:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pad{
  --c:#E5303B;--ink:#fff;
  position:relative;border-radius:var(--r);background:var(--c);color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:clamp(16px,2.4vw,40px);
  padding:clamp(14px,2vh,26px) clamp(20px,2.6vw,44px);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.18),0 14px 30px -18px rgba(0,0,0,.8);
  transition:transform .08s,box-shadow .15s,filter .15s;min-height:0;
}
.pad::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 90% at 0% 0%,rgba(255,255,255,.35),transparent 55%);pointer-events:none}
.pad::after{content:"";position:absolute;right:0;top:0;bottom:0;width:20%;opacity:.16;pointer-events:none;background:repeating-linear-gradient(-45deg,#fff 0 14px,transparent 14px 28px)}
.pad-icon{flex:none;height:min(60%,150px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;position:relative;z-index:1}
.pad-icon svg{width:56%;height:56%}
.pad-txt{position:relative;z-index:1;flex:1;min-width:0}
.pad-name{display:block;font-family:var(--cond);font-weight:800;font-size:clamp(40px,5.6vw,110px);line-height:.85;letter-spacing:.01em}
.pad-sub{display:block;font-size:clamp(12px,1vw,16px);font-weight:600;opacity:.9;margin-top:8px}
.variants{display:flex;flex-wrap:wrap;gap:6px;margin-top:clamp(8px,1.2vh,14px)}
.variants button{border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;background:rgba(11,30,63,.14);color:inherit}
.variants button.on{background:var(--navy);color:#fff}
.pad-key{position:absolute;top:clamp(12px,1.6vh,18px);right:clamp(14px,1.3vw,22px);z-index:2;font-size:12px;font-weight:800;border:2px solid currentColor;border-radius:8px;width:26px;height:26px;display:grid;place-items:center;opacity:.75}
.pad-live{position:absolute;top:clamp(12px,1.6vh,18px);right:clamp(14px,1.3vw,22px);z-index:3;font-size:10px;font-weight:800;letter-spacing:.16em;background:#fff;color:var(--navy);padding:5px 9px;border-radius:999px;opacity:0;transform:scale(.8);transition:.15s}
.ring{position:absolute;width:16%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.7);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;top:50%;left:clamp(80px,9vw,150px)}
.pad.active{transform:translateY(3px) scale(.99);filter:saturate(1.15) brightness(1.06);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 4px #fff,0 0 50px 8px var(--c)}
.pad.active .pad-live{opacity:1;transform:scale(1)}
.pad.active .pad-key{opacity:0}
.pad.active .ring{animation:ring 1.1s ease-out infinite}
.pad.active .ring.r2{animation-delay:.55s}
.pad.active .pad-icon{animation:wiggle .3s ease-in-out infinite}
.pad:focus-visible{outline:4px solid #fff;outline-offset:3px}

/* ---------- MARQUEE ---------- */
.marquee{overflow:hidden;white-space:nowrap;color:#C9DBFF;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marquee div{display:inline-block;animation:marq 40s linear infinite}
.marquee span{font-family:var(--cond);font-weight:700;font-size:clamp(14px,1.2vw,20px);letter-spacing:.12em;margin:0 18px}
.marquee span.s{color:var(--red)}

/* ---------- DOCK DE CONTROLES ---------- */
.dock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ice);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}
.dock .lbl{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:var(--ice-2);border-radius:999px;padding:3px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;color:var(--muted)}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--navy);color:#fff}
.sep{width:1.5px;height:26px;background:var(--line);margin:0 4px}
.vol{display:flex;align-items:center;gap:6px}
.round{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy);flex:none}
.round svg{width:18px;height:18px}
.round.muted{background:var(--red);border-color:var(--red);color:#fff}
input[type=range]{accent-color:var(--blue);width:clamp(90px,10vw,160px)}
.volnum{font:800 13px 'DM Sans';width:44px;text-align:right;color:var(--navy)}
.stop{margin-left:auto;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 20px;background:var(--navy);color:#fff;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.stop svg{width:14px;height:14px}
.stop.hot{background:var(--red);animation:hot 1s ease-in-out infinite}
.stop kbd{font:800 10px 'DM Sans';background:rgba(255,255,255,.18);border-radius:5px;padding:2px 5px}
.fs{background:var(--navy);border:0;color:#fff}

/* luzes de emergência */
#sirenFx{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .25s}
body.siren-on #sirenFx{opacity:1}
#sirenFx::before,#sirenFx::after{content:"";position:absolute;top:0;bottom:0;width:40vw;mix-blend-mode:screen}
#sirenFx::before{left:0;background:radial-gradient(70% 90% at 0% 50%,rgba(229,48,59,.75),transparent 70%);animation:flashA .5s steps(1) infinite}
#sirenFx::after{right:0;background:radial-gradient(70% 90% at 100% 50%,rgba(43,108,255,.8),transparent 70%);animation:flashB .5s steps(1) infinite}

.watermark{position:fixed;right:clamp(14px,1.6vw,28px);bottom:clamp(5px,.8vh,9px);z-index:7;pointer-events:none;font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(201,219,255,.45)}
.watermark b{font-weight:800}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;background:var(--ice);color:var(--navy);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:700;transition:.25s;z-index:10;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes blink{50%{opacity:.25}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.4);opacity:.9}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes ecg{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes flashA{0%{opacity:1}50%{opacity:0}}
@keyframes flashB{0%{opacity:0}50%{opacity:1}}
@keyframes hot{50%{box-shadow:0 0 0 6px rgba(229,48,59,.25)}}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh}
  .nav{border-radius:24px}
  .tag{display:none}
  .main{grid-template-columns:1fr}
  .hero{min-height:340px}
  .pads{grid-template-rows:none}
  .pad{min-height:170px}
  .pad-name{font-size:11vw}
  .dock{border-radius:24px}
  .stop{margin-left:0;width:100%;justify-content:center}
  .sep{display:none}
  .watermark{position:static;display:block;text-align:center;padding:0 0 14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>

<script>
(() => {
let store = {};
try { store = JSON.parse(localStorage.getItem('simulacao-marilene') || '{}') || {}; } catch (e) {}
const save = () => { try { localStorage.setItem('simulacao-marilene', JSON.stringify(store)); } catch (e) {} };
const $ = s => document.querySelector(s);
const toastEl = $('#toast'); let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 2400); }

/* ================= ÁUDIO (sintetizado) ================= */
let ctx = null, master = null;
let volume = (store.vol ?? 80) / 100, muted = false;
const gainTarget = () => muted ? 0 : volume;
function ac(){
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { toast('Este navegador não suporta áudio.'); return null; }
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = gainTarget();
    master.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
  return ctx;
}
// nota de carrilhão eletrônico: senoide suave + harmônicos leves, decaimento longo
function chime(out, f, t, v=.3, d=1.6, bright=.18){
  [[1,1],[2,bright],[3,bright*.35]].forEach(([m, amp]) => {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v * amp, t + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d / m);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .05);
  });
}

const BELLS = {
  // "dim-dom" clássico de porta de entrada (Mi → Dó)
  dimdom: { label:'Dim-dom', cycle:2.1, play(out, t){ chime(out, 659.3, t, .32, 1.6); chime(out, 523.3, t + .55, .32, 2.0); } },
  // aviso de 3 notas, tipo chamada de recepção
  aviso: { label:'Aviso 3 notas', cycle:2.4, play(out, t){ chime(out, 523.3, t, .28, 1.3, .25); chime(out, 659.3, t + .32, .28, 1.3, .25); chime(out, 784, t + .64, .3, 1.9, .25); } },
  // sensor de porta de loja: "dlim-dlom" rápido e brilhante
  sensor: { label:'Sensor de porta', cycle:1.3, play(out, t){ chime(out, 1046.5, t, .26, .7, .3); chime(out, 784, t + .2, .26, .9, .3); } },
};
let bellVariant = BELLS[store.bell] ? store.bell : 'dimdom';

// ---------- SIRENE REALISTA ----------
// onda quadrada (como as sirenes eletrônicas) passando por um "alto-falante de corneta" (filtros) + eco de rua
let irBuf = null;
function getIR(){
  if (irBuf) return irBuf;
  const len = Math.floor(ctx.sampleRate * 1.8);
  irBuf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = irBuf.getChannelData(c);

    const bin = atob(CHORO_B64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const oc = new OAC(1, 44100, 44100);
    const p = oc.decodeAudioData(arr.buffer, b => { babyBuf = b; });
    if (p && p.then) p.then(b => { babyBuf = b; }).catch(() => {});
  } catch (e) {}
})();

const SOUNDS = {
  siren: {
    continuous: true,
    get cycle(){ return SIRENS[sirenVariant].cycle; },
    setup(v){
      const now = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = LO;
      const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = LO; o2.detune.value = 6;
      const mix2 = ctx.createGain(); mix2.gain.value = .35;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 480; hp.Q.value = .8;
      const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1900; pk.gain.value = 6; pk.Q.value = 1.1;
      const pk2 = ctx.createBiquadFilter(); pk2.type = 'peaking'; pk2.frequency.value = 3200; pk2.gain.value = -6; pk2.Q.value = 1.4;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      const env = ctx.createGain(); env.gain.setValueAtTime(0.0001, now); env.gain.exponentialRampToValueAtTime(1, now + .06);
      const dry = ctx.createGain(); dry.gain.value = .13;
      const conv = ctx.createConvolver(); conv.buffer = getIR();
      const wet = ctx.createGain(); wet.gain.value = .05;
      o.connect(hp); o2.connect(mix2); mix2.connect(hp);
      hp.connect(pk); pk.connect(pk2); pk2.connect(lp); lp.connect(env);
      env.connect(dry); dry.connect(v.out);
      env.connect(conv); conv.connect(wet); wet.connect(v.out);
      o.start(); o2.start();
      v.nodes = [o, o2]; v.freqs = [o.frequency, o2.frequency];
    },
    play(v, t){ v.freqs.forEach(f => SIRENS[sirenVariant].play(f, t)); }
  },
  baby: {
    get cycle(){ return babyBuf ? babyBuf.duration + .15 : .3; },
    play(v, t){
      if (!babyBuf) return;
      const src = ctx.createBufferSource(); src.buffer = babyBuf;
      const g = ctx.createGain(); g.gain.value = .9;
      src.connect(g); g.connect(v.out); src.start(t);
      v.nodes.push(src);
    }
  },
  bell: {
    get cycle(){ return BELLS[bellVariant].cycle; },
    play(v, t){ BELLS[bellVariant].play(v.out, t); }
  }
};

const voices = {};
function sched(v){
  while (v.next < ctx.currentTime + .12) {
    const c = v.s.cycle;
    v.s.play(v, v.next); v.cycles.push([v.next, c]); v.next += c;
    if (v.cycles.length > 8) v.cycles.shift();
  }
}
function startSound(id){
  if (voices[id] || !ac()) return;
  const s = SOUNDS[id];
  const out = ctx.createGain(); out.connect(master);
  const v = { id, s, out, next: ctx.currentTime + .02, cycles: [], nodes: [] };
  if (s.setup) s.setup(v);
  sched(v); v.timer = setInterval(() => sched(v), 25);
  voices[id] = v; padUI(id, true);
}
// hard = corta na hora (botão Parar som)
function stopSound(id, hard=false){
  const v = voices[id]; if (!v) return;
  clearInterval(v.timer); delete voices[id];
  const now = ctx.currentTime; let end = now;
  if (!v.s.continuous && !hard) {
    // um toque rápido deixa o "dim-dom" terminar
    const started = v.cycles.filter(c => c[0] <= now);
    const cur = started.length ? started[started.length - 1] : v.cycles[0];
    end = Math.max(now, cur[0] + cur[1] - .05);
  }
  v.out.gain.cancelScheduledValues(now);
  v.out.gain.setValueAtTime(1, end); v.out.gain.linearRampToValueAtTime(0, end + (hard ? .03 : .05));
  setTimeout(() => { try { v.out.disconnect(); } catch(e){} v.nodes.forEach(n => { try { n.stop(); } catch(e){} }); }, (end - now + .15) * 1000);
  if (hard) padUI(id, false);
  else setTimeout(() => { if (!voices[id]) padUI(id, false); }, Math.max(0, (end - now) * 1000));
}
function stopAll(){ Object.keys(voices).forEach(id => stopSound(id, true)); }

/* ================= BOTÕES ================= */
const ICONS = {
  siren:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 36V24a10 10 0 0 1 20 0v12"/><path d="M9 40h30"/><path d="M24 4v4M8.5 10.5l3 3M39.5 10.5l-3 3M3 24h4M41 24h4"/><path d="M24 22v8M20 26h8"/></svg>',
  bell:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 34V22a12 12 0 0 1 24 0v12l4 4H8z"/><path d="M20 42a4 4 0 0 0 8 0"/><path d="M24 6v4"/><path d="M5 18a19 19 0 0 1 5-9M43 18a19 19 0 0 0-5-9"/></svg>'
};
const PADS = [
  { id:'siren', name:'SIRENE', sub:'ambulância chegando', c:'#E5303B', ink:'#fff' },
  { id:'bell',  name:'CAMPAINHA', sub:'entrada de paciente na emergência', c:'#38BDF8', ink:'#0B1E3F' },
];
const VARIANTS = {
  siren: { list: SIRENS, get: () => sirenVariant, set: k => { sirenVariant = k; store.siren = k; } },
  bell:  { list: BELLS,  get: () => bellVariant,  set: k => { bellVariant = k; store.bell = k; } },
};
let mode = store.mode === 'loop' ? 'loop' : 'hold';
const padsEl = $('#pads'); const padEls = {};
const stopBtn = $('#stopBtn');
PADS.forEach((p, i) => {
  const b = document.createElement('div');
  b.className = 'pad'; b.tabIndex = 0; b.setAttribute('role', 'button'); b.setAttribute('aria-label', p.name);
  b.style.setProperty('--c', p.c); b.style.setProperty('--ink', p.ink);
  const variants = `<div class="variants" data-pad="${p.id}">${Object.entries(VARIANTS[p.id].list).map(([k, o]) => `<button data-v="${k}">${o.label}</button>`).join('')}</div>`;
  b.innerHTML = `<span class="ring"></span><span class="ring r2"></span>
    <span class="pad-icon">${ICONS[p.id]}</span>
    <span class="pad-txt"><span class="pad-name">${p.name}</span><span class="pad-sub">${p.sub}</span>${variants}</span>
    <span class="pad-key">${i+1}</span><span class="pad-live">TOCANDO</span>`;
  bindPad(b, p.id);
  padsEl.appendChild(b); padEls[p.id] = b;
});
function bindPad(b, id){
  b.addEventListener('pointerdown', e => {
    if (e.button && e.button !== 0) return;
    if (e.target.closest('.variants')) return;
    e.preventDefault();
    if (mode === 'loop') { voices[id] ? stopSound(id, true) : startSound(id); return; }
    try { b.setPointerCapture(e.pointerId); } catch(_){}
    startSound(id);
  });
  const up = () => { if (mode === 'hold') stopSound(id); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
// ---- OUTROS (botões pequenos) ----
const OTHERS = [
  { id:'baby', emo:'👶', name:'Choro de bebê', key:'3' },
];
const othersEl = document.createElement('div');
othersEl.className = 'others';
othersEl.innerHTML = '<span class="lbl">Outros</span>';
OTHERS.forEach(o => {
  const m = document.createElement('div');
  m.className = 'mini'; m.tabIndex = 0; m.setAttribute('role', 'button'); m.setAttribute('aria-label', o.name);
  m.innerHTML = `<span class="emo">${o.emo}</span>${o.name}<span class="k">${o.key}</span>`;
  bindPad(m, o.id);
  othersEl.appendChild(m); padEls[o.id] = m;
});
padsEl.appendChild(othersEl);
// escolha do tipo de som de cada botão (toca uma prévia curta)
let previewT = {};
function renderVariants(){
  document.querySelectorAll('.variants').forEach(g => {
    const cur = VARIANTS[g.dataset.pad].get();
    g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === cur));
  });
}
document.querySelectorAll('.variants button').forEach(x => {
  const id = x.parentElement.dataset.pad;
  x.addEventListener('pointerdown', e => e.stopPropagation());
  x.addEventListener('click', e => {
    e.stopPropagation();
    VARIANTS[id].set(x.dataset.v); save(); renderVariants();
    if (voices[id]) stopSound(id, true);
    if (!ac()) return;
    if (id === 'bell') { BELLS[bellVariant].play(master, ctx.currentTime + .02); return; }
    // prévia da sirene: 3 s
    startSound(id); clearTimeout(previewT[id]);
    previewT[id] = setTimeout(() => stopSound(id), 3000);
  });
});
renderVariants();

// cena da chegada do paciente (dura 4,8 s; repete se a campainha continuar tocando)
const sceneEl = $('#scene'); let sceneT;
function playScene(){
  sceneEl.classList.remove('arrive'); void sceneEl.offsetWidth; sceneEl.classList.add('arrive');
  clearTimeout(sceneT);
  sceneT = setTimeout(() => { sceneEl.classList.remove('arrive'); if (voices.bell) playScene(); }, 4800);
}
function padUI(id, on){
  const el = padEls[id]; if (!el) return;
  el.classList.toggle('active', on);
  const live = el.querySelector('.pad-live'); if (live) live.textContent = mode === 'loop' ? 'REPETINDO' : 'TOCANDO';
  if (id === 'siren') document.body.classList.toggle('siren-on', on);
  if (id === 'bell' && on && !sceneEl.classList.contains('arrive')) playScene();
  const any = Object.values(padEls).some(p => p.classList.contains('active'));
  document.body.classList.toggle('playing', any);
  stopBtn.classList.toggle('hot', any);
}

/* ================= CONTROLES ================= */
stopBtn.onclick = stopAll;

function setMode(m){
  mode = m; store.mode = m; save();
  $('#modeHold').classList.toggle('on', m === 'hold');
  $('#modeLoop').classList.toggle('on', m === 'loop');
  stopAll();
}
$('#modeHold').onclick = () => { setMode('hold'); toast('Segure o botão para tocar · solte para parar'); };
$('#modeLoop').onclick = () => { setMode('loop'); toast('Um clique liga e fica repetindo · outro clique (ou Parar som) desliga'); };
setMode(mode);

const volEl = $('#vol'), volNum = $('#volNum'), muteBtn = $('#muteBtn');
const ICON_VOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
function applyVol(){
  volEl.value = Math.round(volume * 100);
  volNum.textContent = muted ? 'mudo' : Math.round(volume * 100) + '%';
  muteBtn.innerHTML = muted ? ICON_MUTE : ICON_VOL;
  muteBtn.classList.toggle('muted', muted);
  if (master) master.gain.setTargetAtTime(gainTarget(), ctx.currentTime, .02);
  store.vol = Math.round(volume * 100); save();
}
function setVol(v){ volume = Math.round(Math.max(0, Math.min(1, v)) * 100) / 100; if (volume > 0) muted = false; applyVol(); }
volEl.addEventListener('input', () => setVol(volEl.value / 100));
$('#volUp').onclick = () => setVol(volume + .1);
$('#volDown').onclick = () => setVol(volume - .1);
muteBtn.onclick = () => { muted = !muted; applyVol(); };
applyVol();

const words = ['SIMULAÇÃO MARILENE','URGÊNCIA E EMERGÊNCIA','SIMULAÇÃO REALÍSTICA','AVALIE A CENA','CHAME AJUDA','TRABALHO EM EQUIPE','CADA SEGUNDO CONTA'];
const seq = words.map(w => `<span>${w}</span><span class="s">✚</span>`).join('');
$('#marq').innerHTML = seq + seq + seq + seq;

function toggleFS(){
  const el = document.documentElement, isFS = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    const p = isFS ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if (p && p.catch) p.catch(() => toast('Use F11 no navegador para tela cheia'));
  } catch (e) { toast('Use F11 no navegador para tela cheia'); }
}
$('#fsBtn').onclick = toggleFS;

/* ================= TECLADO ================= */
const keyMap = { '1':'siren', '2':'bell', '3':'baby' };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const id = keyMap[e.key];
  if (id) { e.preventDefault(); if (e.repeat) return; if (mode === 'loop') { voices[id] ? stopSound(id, true) : startSound(id); } else startSound(id); return; }
  if (e.repeat) return;
  if (e.key === 'Escape' || e.code === 'Space') { e.preventDefault(); stopAll(); }
  else if (e.key === 'm' || e.key === 'M') { muted = !muted; applyVol(); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
  else if (e.key === 'ArrowUp' || e.key === '+') setVol(volume + .1);
  else if (e.key === 'ArrowDown' || e.key === '-') setVol(volume - .1);
});
document.addEventListener('keyup', e => { const id = keyMap[e.key]; if (id && mode === 'hold') stopSound(id); });
window.addEventListener('blur', () => { if (mode === 'hold') Object.keys(voices).forEach(id => stopSound(id)); });
})();
</script>
